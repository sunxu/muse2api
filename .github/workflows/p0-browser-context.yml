name: Account isolation, proxy and offline API regressions

on:
  push:
    branches:
      - feature/account-proxy-isolation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  offline-isolation-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and offline test dependencies
        run: python -m pip install -r requirements.txt pytest httpx
      - name: Compile changed Python modules
        run: python -m py_compile engine.py proxy_bridge.py cdp.py app.py scripts/check_context_proxy_live.py tests/test_browser_context_isolation.py tests/test_proxy_bridge.py tests/test_account_lease_safety.py
      - name: Run offline BrowserContext and concurrency regressions
        run: python -m pytest -q tests/test_browser_context_isolation.py tests/test_concurrency.py tests/test_proxy_bridge.py tests/test_account_lease_safety.py
      - name: Run offline quota and keepalive regressions
        run: |
          python tests/test_quota_account_binding.py
          python tests/test_keepalive_scheduling.py
      - name: Run offline session, wake, refusal and image API regressions
        run: |
          python tests/test_session_health.py
          python tests/test_wake_confirmation.py
          python tests/test_refusal_rotation.py
          python tests/test_async_images.py
          python -m pytest -q tests/test_quota_localization.py
      - name: Run broad offline API, media and safety regressions
        run: |
          python tests/test_admin_base_url.py
          python tests/test_cookie_requirements.py
          python tests/test_extension_zip.py
          python tests/test_media_delete.py
          python tests/test_muse_video_delivery.py
          python tests/test_reference_limits.py
          python tests/test_ref_image_safety.py
          python tests/test_vm_wait.py engine.py --assert
          node tests/test_admin_api_error_messages.mjs
